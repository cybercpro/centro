<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado de Scrip | Centro de Servicios Digitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-body: #0a0a12;
  --bg-card: rgba(22,22,34,.78);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --accent: #00f0ff;
  --accent-purple: #a855f7;
  --border: rgba(255,255,255,0.10);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text-primary);
  background:var(--bg-body);
  line-height:1.6;
}
.content { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:2rem 1rem; }
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
.back-link {
  color:var(--accent); text-decoration:none; font-weight:700; font-size:.95rem;
}
.title {
  text-align:center; font-size:2rem; font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent-purple));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:.5rem;
}
.subtitle { text-align:center; color:var(--text-secondary); margin-bottom:2rem; }
.scripts-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.2rem; }
.card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:18px; padding:1.4rem;
}
.card h3 { font-size:1.1rem; margin-bottom:.4rem; }
.card p { color:var(--text-secondary); font-size:.9rem; }
</style>
</head>
<body>
<div class="content">
  <div class="top-bar">
    <a href="index.html" class="back-link">← Volver al inicio</a>
    <span style="color:var(--text-secondary); font-size:.85rem;">Mercado de Scrip</span>
  </div>

  <h1 class="title">Mercado de Scrip</h1>
  <p class="subtitle">Sección en construcción — iremos agregando los scripts uno por uno.</p>

  <div class="scripts-list" id="lista-scripts">
    <div class="card">
      <h3>Próximamente: Primer Scrip</h3>
      <p>Aquí vamos a ir cargando cada script con su descripción y botón de compra.</p>
    </div>
  </div>
</div>
</body>
</html>
